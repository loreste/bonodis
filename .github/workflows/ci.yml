name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: mako-x86_64-unknown-linux-gnu
          - os: macos-latest
            asset: mako-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install makori
        run: |
          mkdir -p "$HOME/.local/bin"
          gh release download v0.5.15 -R loreste/mako -p "${{ matrix.asset }}" -D "$HOME/.local/bin"
          mv "$HOME/.local/bin/${{ matrix.asset }}" "$HOME/.local/bin/mako"
          chmod +x "$HOME/.local/bin/mako"
          ln -sf "$HOME/.local/bin/mako" "$HOME/.local/bin/makori"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
        env:
          GH_TOKEN: ${{ github.token }}

      - name: verify
        run: mako --version

      - name: test
        run: mako test .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
