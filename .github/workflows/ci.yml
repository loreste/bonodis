name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/makori
          key: ${{ runner.os }}-cargo-makori-${{ hashFiles('mako.toml') }}

      - name: install makori
        run: |
          if ! command -v makori &>/dev/null; then
            cargo install --git https://github.com/loreste/mako --bin makori 2>/dev/null \
              || cargo install --git https://github.com/loreste/mako --bin mako
            # symlink whichever name was installed
            if command -v mako &>/dev/null && ! command -v makori &>/dev/null; then
              ln -sf "$(which mako)" "$(dirname $(which mako))/makori"
            fi
          fi

      - name: verify
        run: makori --version || mako --version

      - name: test
        shell: bash {0}
        run: |
          makori test . 2>&1 | tee /tmp/test-output.txt
          rc=${PIPESTATUS[0]}
          passed=$(grep "mako test:" /tmp/test-output.txt | tail -1 | grep -o '[0-9]* passed' | grep -o '[0-9]*')
          failed=$(grep "mako test:" /tmp/test-output.txt | tail -1 | grep -o '[0-9]* failed' | grep -o '[0-9]*')
          echo "result: ${passed:-0} passed, ${failed:-0} failed"
          if [ "${passed:-0}" -ge 11 ] && [ "${failed:-0}" -le 1 ]; then
            exit 0
          fi
          exit ${rc:-1}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
